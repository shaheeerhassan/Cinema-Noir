<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Noir - Movie Details</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@200..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,line-clamp"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#121414",
                        "surface-container-low": "#1a1c1c",
                        "surface-container": "#1e2020",
                        "surface-container-high": "#282a2b",
                        "surface-container-highest": "#333535",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#cfc4c5",
                        secondary: "#ffd65b",
                        "secondary-fixed-dim": "#f0c110",
                        "on-secondary": "#3d2f00",
                        "outline-variant": "#4c4546",
                        "error-container": "#93000a"
                    },
                    fontFamily: { sans: ["Inter"] }
                }
            }
        };
    </script>

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
        .hover\\:glow-yellow:hover { text-shadow: 0 0 12px rgba(245, 197, 24, 0.55); }
    </style>
</head>
<body class="bg-background text-on-surface font-sans antialiased min-h-screen pb-24 md:pb-0">
    <header class="bg-black/95 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-10 py-4 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black italic tracking-tighter text-secondary uppercase">CINEMA NOIR</a>
            <div class="flex items-center gap-3">
                <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-white/10 bg-surface-container-highest/50 hover:border-secondary hover:text-secondary hover:glow-yellow transition">
                    <span class="material-symbols-outlined">arrow_back</span>
                    <span class="hidden sm:inline">Browse</span>
                </a>
            </div>
        </div>
    </header>

    <main class="w-full">
        <!-- Hero poster backdrop -->
        <section class="relative overflow-hidden">
            <div class="absolute inset-0">
                <div class="absolute inset-0 bg-gradient-to-t from-background via-background/92 to-background/10"></div>
                <img id="heroBackdrop" alt="Backdrop" class="w-full h-[340px] md:h-[460px] object-cover opacity-35" src="" />
            </div>

            <div class="relative max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-10 pt-10 md:pt-14 pb-10">
                <div id="movieDetails" class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                    <!-- Poster + actions -->
                    <aside class="lg:col-span-4">
                        <div class="w-full max-w-sm">
                            <img id="posterImg" src="" alt="Movie Poster" class="w-full rounded-2xl border border-white/10 shadow-2xl shadow-black/70" />
                            <div class="mt-5 space-y-3">
                                <button id="watchlistBtn" onclick="toggleWatchlist()" class="w-full bg-secondary text-on-secondary font-bold py-3.5 rounded-xl hover:bg-secondary-fixed-dim transition shadow-[0_0_18px_rgba(245,197,24,0.22)]">
                                    Add to Watchlist
                                </button>
                                <button onclick="history.back()" class="w-full bg-surface-container-high border border-white/10 hover:border-secondary py-3.5 rounded-xl transition">
                                    Go Back
                                </button>
                            </div>
                        </div>
                    </aside>

                    <!-- Details -->
                    <section class="lg:col-span-8">
                        <h1 id="movieTitle" class="text-5xl md:text-6xl font-extrabold tracking-tight"></h1>

                        <div class="mt-5 flex flex-wrap gap-3 text-sm">
                            <span id="yearBadge" class="px-3 py-1.5 rounded-full border border-white/10 bg-black/30"></span>
                            <span id="ratingBadge" class="px-3 py-1.5 rounded-full border border-white/10 bg-black/30"></span>
                            <span id="runtimeBadge" class="px-3 py-1.5 rounded-full border border-white/10 bg-black/30"></span>
                            <span id="contentRatingBadge" class="px-3 py-1.5 rounded-full border border-white/10 bg-black/30"></span>
                        </div>

                        <div class="mt-10 border-t border-white/10 pt-8">
                            <h2 class="text-2xl font-bold">Synopsis</h2>
                            <p id="description" class="text-on-surface-variant mt-3 leading-relaxed text-lg"></p>
                        </div>

                        <div class="mt-10 border-t border-white/10 pt-8">
                            <div class="flex items-center justify-between gap-4 mb-5">
                                <h2 class="text-2xl font-bold">Cast</h2>
                                <span class="text-on-surface-variant text-sm">Top billed</span>
                            </div>
                            <div id="castGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
                                <!-- Cast members -->
                            </div>
                        </div>

                        <div class="mt-10 border-t border-white/10 pt-8">
                            <h2 class="text-2xl font-bold">Genres</h2>
                            <div id="genresList" class="mt-4 flex flex-wrap gap-2">
                                <!-- Genres -->
                            </div>
                        </div>

                        <div class="mt-10 border-t border-white/10 pt-8">
                            <h2 class="text-2xl font-bold">Reviews</h2>

                            <div id="reviewForm" class="hidden mt-5 bg-surface-container-low/60 border border-white/10 rounded-2xl p-6">
                                <h3 class="font-bold">Rate & Review</h3>
                                <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Rating (1.0 - 10.0)</label>
                                        <input type="number" id="ratingInput" min="1.0" max="10.0" step="0.1" value="8.0" class="w-full bg-surface-container-highest/50 border border-outline-variant/60 rounded-lg px-3 py-3 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition" />
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Comment</label>
                                        <textarea id="commentInput" rows="3" placeholder="Write your thoughts..." class="w-full bg-surface-container-highest/50 border border-outline-variant/60 rounded-lg px-4 py-3 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition resize-none"></textarea>
                                    </div>
                                </div>
                                <div class="mt-4 flex justify-end">
                                    <button onclick="submitReview()" class="bg-secondary text-on-secondary font-bold px-6 py-3 rounded-lg hover:bg-secondary-fixed-dim transition">
                                        Submit Review
                                    </button>
                                </div>
                            </div>

                            <div id="reviewsList" class="mt-6 space-y-4">
                                <!-- Reviews -->
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <nav class="md:hidden bg-black/95 backdrop-blur-md fixed bottom-0 left-0 w-full z-50 border-t border-white/10">
        <div class="flex justify-around items-center px-4 py-3 text-[10px] font-semibold uppercase tracking-widest">
            <a href="index.html" class="flex flex-col items-center justify-center text-neutral-500 hover:text-secondary transition px-3 py-1">
                <span class="material-symbols-outlined">movie</span>
                <span>Home</span>
            </a>
            <a href="watchlist.html" class="flex flex-col items-center justify-center text-neutral-500 hover:text-secondary transition px-3 py-1">
                <span class="material-symbols-outlined">bookmark</span>
                <span>Watchlist</span>
            </a>
            <button onclick="history.back()" class="flex flex-col items-center justify-center text-secondary bg-neutral-900/50 rounded-lg px-3 py-1 transition">
                <span class="material-symbols-outlined">arrow_back</span>
                <span>Back</span>
            </button>
            <a href="login.html" class="flex flex-col items-center justify-center text-neutral-500 hover:text-secondary transition px-3 py-1">
                <span class="material-symbols-outlined">login</span>
                <span>Login</span>
            </a>
        </div>
    </nav>

    <script src="js/api.js"></script>
    <script src="js/movie-details.js"></script>
</body>
</html>
