<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Noir - Watchlist</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@200..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,line-clamp"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#121414",
                        "surface-container-low": "#1a1c1c",
                        "surface-container": "#1e2020",
                        "surface-container-highest": "#333535",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#cfc4c5",
                        secondary: "#ffd65b",
                        "secondary-fixed-dim": "#f0c110",
                        "on-secondary": "#3d2f00",
                        "outline-variant": "#4c4546",
                        "error-container": "#93000a",
                        "on-error": "#690005"
                    },
                    fontFamily: { sans: ["Inter"] }
                }
            }
        };
    </script>

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
        .hover\\:glow-yellow:hover { text-shadow: 0 0 12px rgba(245, 197, 24, 0.55); }
    </style>
</head>
<body class="bg-background text-on-surface font-sans antialiased min-h-screen pb-24 md:pb-0">
    <header class="bg-black/95 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-10 py-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-8">
                <a href="index.html" class="text-2xl font-black italic tracking-tighter text-secondary uppercase">CINEMA NOIR</a>
                <nav class="hidden md:flex items-center gap-6 text-sm">
                    <a href="index.html" class="text-neutral-400 hover:text-white hover:text-secondary hover:glow-yellow transition">Browse</a>
                    <a href="watchlist.html" class="text-secondary font-semibold border-b-2 border-secondary pb-1 hover:glow-yellow transition">Watchlist</a>
                    <a href="actors.html" class="text-neutral-400 hover:text-white hover:text-secondary hover:glow-yellow transition">Actors</a>
                </nav>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="logout()" class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-white/10 bg-surface-container-highest/50 text-on-surface hover:border-secondary hover:text-secondary hover:glow-yellow transition">
                    <span class="material-symbols-outlined">logout</span>
                    <span class="hidden sm:inline">Logout</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-10 py-10 md:py-14">
        <div class="mb-10">
            <h1 class="text-5xl font-extrabold tracking-tight">Your Watchlist</h1>
            <p class="text-on-surface-variant mt-2">A curated selection awaiting the next screening.</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-20 border border-white/10 bg-surface-container-low/60 rounded-2xl">
            <div class="mx-auto w-14 h-14 rounded-2xl bg-black/40 border border-white/10 flex items-center justify-center mb-5">
                <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">bookmark</span>
            </div>
            <p class="text-2xl font-bold">Your watchlist is empty</p>
            <p class="text-on-surface-variant mt-2">Start with a film that deserves your full attention.</p>
            <a href="index.html" class="mt-7 inline-flex items-center justify-center gap-2 bg-secondary text-on-secondary font-semibold px-7 py-3.5 rounded-lg hover:bg-secondary-fixed-dim transition shadow-[0_0_18px_rgba(245,197,24,0.22)]">
                <span class="material-symbols-outlined">movie</span>
                Browse Movies
            </a>
        </div>

        <!-- Watchlist Grid -->
        <div id="watchlistGrid" class="hidden grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
            <!-- Movies will be populated here -->
        </div>
    </main>

    <nav class="md:hidden bg-black/95 backdrop-blur-md fixed bottom-0 left-0 w-full z-50 border-t border-white/10">
        <div class="flex justify-around items-center px-4 py-3 text-[10px] font-semibold uppercase tracking-widest">
            <a href="index.html" class="flex flex-col items-center justify-center text-neutral-500 hover:text-secondary transition px-3 py-1">
                <span class="material-symbols-outlined">movie</span>
                <span>Home</span>
            </a>
            <a href="actors.html" class="flex flex-col items-center justify-center text-neutral-500 hover:text-secondary transition px-3 py-1">
                <span class="material-symbols-outlined">person</span>
                <span>Actors</span>
            </a>
            <a href="watchlist.html" class="flex flex-col items-center justify-center text-secondary bg-neutral-900/50 rounded-lg px-3 py-1 transition">
                <span class="material-symbols-outlined fill">bookmark</span>
                <span>Watchlist</span>
            </a>
            <button onclick="logout()" class="flex flex-col items-center justify-center text-neutral-500 hover:text-secondary transition px-3 py-1">
                <span class="material-symbols-outlined">logout</span>
                <span>Logout</span>
            </button>
        </div>
    </nav>

    <script src="js/api.js"></script>
    <script src="js/watchlist.js"></script>
</body>
</html>
