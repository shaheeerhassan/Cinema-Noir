<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Noir - Actors</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@200..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,line-clamp"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#121414",
                        "surface-container-low": "#1a1c1c",
                        "surface-container": "#1e2020",
                        "surface-container-highest": "#333535",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#cfc4c5",
                        secondary: "#ffd65b",
                        "secondary-fixed-dim": "#f0c110",
                        "on-secondary": "#3d2f00",
                        "outline-variant": "#4c4546"
                    },
                    fontFamily: { sans: ["Inter"] }
                }
            }
        };
    </script>

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .hover\\:glow-yellow:hover { text-shadow: 0 0 12px rgba(245, 197, 24, 0.55); }
    </style>
</head>
<body class="bg-background text-on-surface font-sans antialiased min-h-screen pb-24 md:pb-0">
    <header class="bg-black/95 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-10 py-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-8">
                <a href="index.html" class="text-2xl font-black italic tracking-tighter text-secondary uppercase">CINEMA NOIR</a>
                <nav class="hidden md:flex items-center gap-6 text-sm">
                    <a href="index.html" class="text-neutral-400 hover:text-white hover:text-secondary hover:glow-yellow transition">Browse</a>
                    <a href="watchlist.html" class="text-neutral-400 hover:text-white hover:text-secondary hover:glow-yellow transition">Watchlist</a>
                    <a href="actors.html" class="text-secondary font-semibold border-b-2 border-secondary pb-1 hover:glow-yellow transition">Actors</a>
                </nav>
            </div>
            <div class="hidden sm:flex items-center gap-2 text-on-surface-variant">
                <span class="material-symbols-outlined text-secondary">filter_alt</span>
                <span class="text-sm">Search by name</span>
            </div>
        </div>
    </header>

    <main class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-10 py-10 md:py-14">
        <div class="mb-10">
            <h1 class="text-5xl font-extrabold tracking-tight">Actors</h1>
            <p class="text-on-surface-variant mt-2">Faces that define the frame. Search and discover.</p>
        </div>

        <!-- Search Section -->
        <div class="border border-white/10 bg-surface-container-low/60 rounded-2xl p-6 md:p-8 mb-10">
            <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2" for="actorSearch">Search</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary">search</span>
                <input type="text" id="actorSearch" placeholder="Search actors by name..." class="w-full bg-surface-container border border-outline-variant/60 rounded-lg py-3.5 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition" />
            </div>
        </div>

        <!-- Actors Grid -->
        <div id="actorsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
            <!-- Actors will be populated here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 border border-white/10 bg-surface-container-low/60 rounded-2xl mt-10">
            <p class="text-2xl font-bold">No actors found</p>
            <p class="text-on-surface-variant mt-2">Try a shorter keyword.</p>
        </div>
    </main>

    <!-- Movies Modal -->
    <div id="moviesModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-surface-container rounded-2xl w-full max-w-4xl max-h-[80vh] overflow-hidden flex flex-col shadow-2xl border border-white/10">
            <div class="p-6 border-b border-white/10 flex items-center justify-between">
                <h2 id="modalTitle" class="text-2xl font-bold">Actor's Movies</h2>
                <button onclick="closeModal()" class="material-symbols-outlined hover:text-secondary transition">close</button>
            </div>
            <div id="modalContent" class="p-6 overflow-y-auto grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Movies populated by JS -->
            </div>
        </div>
    </div>

    <nav class="md:hidden bg-black/95 backdrop-blur-md fixed bottom-0 left-0 w-full z-50 border-t border-white/10">
        <div class="flex justify-around items-center px-4 py-3 text-[10px] font-semibold uppercase tracking-widest">
            <a href="index.html" class="flex flex-col items-center justify-center text-neutral-500 hover:text-secondary transition px-3 py-1">
                <span class="material-symbols-outlined">movie</span>
                <span>Home</span>
            </a>
            <a href="actors.html" class="flex flex-col items-center justify-center text-secondary bg-neutral-900/50 rounded-lg px-3 py-1 transition">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
                <span>Actors</span>
            </a>
            <a href="watchlist.html" class="flex flex-col items-center justify-center text-neutral-500 hover:text-secondary transition px-3 py-1">
                <span class="material-symbols-outlined">bookmark</span>
                <span>Watchlist</span>
            </a>
            <a href="login.html" class="flex flex-col items-center justify-center text-neutral-500 hover:text-secondary transition px-3 py-1">
                <span class="material-symbols-outlined">login</span>
                <span>Login</span>
            </a>
        </div>
    </nav>

    <script src="js/api.js"></script>
    <script src="js/actors.js"></script>
</body>
</html>
