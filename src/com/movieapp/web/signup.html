<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Noir - Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@200..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#121414",
                        "surface-container-lowest": "#0c0f0f",
                        "surface-container-low": "#1a1c1c",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#cfc4c5",
                        secondary: "#ffd65b",
                        "secondary-fixed-dim": "#f0c110",
                        "on-secondary": "#3d2f00",
                        "outline-variant": "#4c4546",
                        "error-container": "#93000a"
                    },
                    fontFamily: { sans: ["Inter"] }
                }
            }
        };
    </script>

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>

<body class="bg-background text-on-surface min-h-screen font-sans antialiased selection:bg-secondary/30 selection:text-secondary">
    <main class="min-h-screen flex">
        <!-- Left Side: Cinematic Imagery -->
        <section class="hidden lg:flex lg:w-1/2 relative bg-surface-container-lowest items-end p-16 overflow-hidden">
            <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center grayscale opacity-60"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-background via-background/60 to-transparent"></div>
            <div class="absolute inset-0 shadow-[inset_0_0_150px_rgba(0,0,0,0.9)] pointer-events-none"></div>
            <div class="relative z-10 max-w-lg">
                <div class="w-12 h-1 bg-secondary mb-8"></div>
                <h1 class="text-6xl font-extrabold tracking-tight">Director's Cut.</h1>
                <p class="mt-6 text-on-surface-variant text-lg">Join the screening room. Discover films curated for the true connoisseur, free from distractions.</p>
            </div>
        </section>

        <!-- Right Side: Form -->
        <section class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-secondary/5 rounded-full blur-[110px] pointer-events-none translate-x-1/3 -translate-y-1/3"></div>

            <div class="w-full max-w-md relative z-10">
                <div class="mb-10 text-center lg:text-left">
                    <a href="index.html" class="inline-block text-secondary font-black italic tracking-tighter uppercase text-2xl">CINEMA NOIR</a>
                    <h2 class="mt-5 text-3xl font-bold">Request Access</h2>
                    <p class="mt-2 text-on-surface-variant">Secure your seat for the next screening.</p>
                </div>

                <form onsubmit="handleSignup(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold mb-2" for="username">Username</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
                            <input id="username" type="text" required minlength="3" placeholder="Enter a unique alias" class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3.5 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition" />
                        </div>
                        <p class="text-xs text-on-surface-variant/70 mt-2">At least 3 characters</p>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2" for="password">Password</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
                            <input id="password" type="password" required minlength="6" placeholder="••••••••" class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3.5 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition" />
                        </div>
                        <p class="text-xs text-on-surface-variant/70 mt-2">At least 6 characters</p>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2" for="confirmPassword">Confirm Password</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock_reset</span>
                            <input id="confirmPassword" type="password" required placeholder="••••••••" class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3.5 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition" />
                        </div>
                    </div>

                    <div id="errorMessage" class="hidden bg-error-container/20 border border-error-container text-on-surface px-4 py-3 rounded text-sm"></div>
                    <div id="successMessage" class="hidden bg-secondary/15 border border-secondary text-on-surface px-4 py-3 rounded text-sm"></div>

                    <div class="pt-2">
                        <button type="submit" class="w-full bg-secondary text-on-secondary font-bold py-4 rounded-lg hover:bg-secondary-fixed-dim transition-all duration-300 shadow-lg shadow-secondary/10 hover:shadow-secondary/30 active:scale-[0.98] flex justify-center items-center gap-2">
                            <span>Sign Up</span>
                            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
                        </button>
                    </div>
                </form>

                <div class="mt-8 text-center text-on-surface-variant">
                    <span>Already have a ticket?</span>
                    <a href="login.html" class="ml-1 text-secondary font-bold hover:underline underline-offset-4">Log In</a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script>
        async function handleSignup(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match!';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    await response.json().catch(() => ({}));
                    successDiv.textContent = 'Account created successfully! Redirecting to login...';
                    successDiv.classList.remove('hidden');
                    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
                } else {
                    const error = await response.json().catch(() => ({}));
                    errorDiv.textContent = error.message || 'Sign up failed. Please try again.';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Error: ' + error.message;
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
